# Publie le terminal CENTRAL (dossier public/ uniquement) sur GitHub Pages.
# Le reste du dépôt (règles, tests) n'est pas mis en ligne.
name: Publier CENTRAL sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le dossier public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Mettre en ligne
        id: deployment
        uses: actions/deploy-pages@v5
